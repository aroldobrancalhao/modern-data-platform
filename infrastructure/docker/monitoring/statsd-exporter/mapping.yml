# Modern Data Platform
#
# statsd_exporter mapping config: translates Airflow's dotted StatsD
# metric names (AIRFLOW__METRICS__STATSD_ON, see docker-compose.yml)
# into labeled Prometheus metrics. Without this, every dag_id/task_id
# combination Airflow emits becomes its own metric *name* instead of
# a label value on a shared metric -- unbounded cardinality of metric
# names, useless in Prometheus/Grafana.
#
# Scope: DAG run duration (success/failed), task duration, task
# finish state, pool slot usage, scheduler heartbeat -- the subset of
# Airflow's StatsD metrics (see Airflow's own "logging-monitoring"
# docs) actually useful for this platform's one real DAG today.
# Anything not matched here falls through to statsd_exporter's
# default behavior (metric name = the dotted string, no labels) --
# still scraped, just not cleaned up; can be extended here later
# without touching Airflow config.
#
# Reference: Airflow docs, "Configuring StatsD", exporter mapping
# example.
#
# Update, 2026-08-12: ttl added to airflow.ti.finish.*.*.* only (not
# a global `defaults:` block -- keeps the blast radius to the one
# mapping that actually needed it). Root cause: statsd_exporter
# caches a counter's last value and re-exposes it on every scrape
# forever once observed -- with no TTL, a task-finish counter that
# fires once (e.g. one real failure) stays pinned at that value
# indefinitely. Combined with a Prometheus increase()-based alert
# query, this is a permanent false negative, not just cosmetic: a
# brand-new series' very first sample already carries the nonzero
# value (there's no prior "0" sample for increase()/rate() to diff
# against -- the classic counter cold-start blind spot), so the
# alert never fires on the failure it exists to catch. ttl: 15m makes
# the series disappear from /metrics 15m after its last increment,
# restoring real absent()/NoData semantics -- paired with the
# corresponding query change in ../grafana/provisioning/alerting/
# rules.yml (sum() instant read instead of sum(increase(...[15m]))).
# See docs/architecture/roadmap-next-steps.md for the real
# end-to-end failure that surfaced this and the validation after the
# fix.

mappings:

  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_success_seconds"
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_failed_seconds"
    labels:
      dag_id: "$1"

  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.ti.start.*.*"
    name: "airflow_task_start_total"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_task_finish_total"
    ttl: 15m
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"

  - match: "airflow.pool.open_slots.*"
    name: "airflow_pool_open_slots"
    labels:
      pool: "$1"

  - match: "airflow.pool.queued_slots.*"
    name: "airflow_pool_queued_slots"
    labels:
      pool: "$1"

  - match: "airflow.pool.running_slots.*"
    name: "airflow_pool_running_slots"
    labels:
      pool: "$1"

  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat_total"
