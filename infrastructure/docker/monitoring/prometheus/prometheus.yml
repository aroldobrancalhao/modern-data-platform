# Modern Data Platform
#
# Prometheus scrape config. Three sources (Sprint 13, Decision 4):
#   - statsd-exporter: native Airflow metrics (StatsD -> Prometheus,
#     see monitoring/statsd-exporter/mapping.yml).
#   - pushgateway: short-lived processes that can't be scraped
#     directly (extract_postgres and the two run_*_once.py scripts --
#     see PrometheusHook.push()).
#   - bronze-consumer: long-running process, scraped directly.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "statsd-exporter"
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: "pushgateway"
    # Preserves the job/label set each PrometheusHook.push() call
    # sends (job=extract_postgres, etc.) instead of overwriting it
    # with this scrape config's own job_name/instance labels, which
    # is what honor_labels is for.
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "bronze-consumer"
    static_configs:
      - targets: ["bronze-consumer:9200"]
