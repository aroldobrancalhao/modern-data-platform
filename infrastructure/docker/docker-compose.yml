# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Use this option ONLY for quick checks. Installing requirements at container
#                                startup is done EVERY TIME the service is started.
#                                A better way is to build a custom image or extend the official image
#                                as described in https://airflow.apache.org/docs/docker-stack/build.html.
#                                Default: ''
#
# Feel free to modify this file to suit your needs.
---
x-airflow-common:
  &airflow-common
  # Extended image: build-essential (needed to compile mmh3, a
  # dbt-athena dependency with no cp313 wheel in its version range)
  # plus every provider/package this platform's DAGs need, fixed at
  # build time -- see infrastructure/docker/airflow/Dockerfile.
  # _PIP_ADDITIONAL_REQUIREMENTS was tried first and reverted: it only
  # runs `pip install` as the container's own user, with no way to
  # apt-get install a compiler, so mmh3's sdist build always failed.
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    POSTGRES_HOST: postgres-marketplace
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    AIRFLOW_DB_HOST: postgres-airflow
    AIRFLOW_DB_PORT: 5432
    AIRFLOW_DB_NAME: airflow
    AIRFLOW_DB_USER: airflow
    AIRFLOW_DB_PASSWORD: airflow

    KAFKA_BOOTSTRAP_SERVER: kafka:9092

    # Dedicated, scoped IAM User (mdp-airflow-ingest-dev, Terraform
    # module.airflow_ingest) -- covers what Airflow's own credential
    # actually does: extract_postgres's raw/ S3 read-write, and remote
    # task-log shipping to CloudWatch via AirflowManager._build_connections
    # (reads these into the aws_default Connection's login/password). No
    # IAM role available on this local dev machine, see ADR-003.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    # Real, live-caught gap (Sprint 13 close-out): no AWS_REGION/
    # AWS_DEFAULT_REGION was ever set for these containers -- worked
    # by accident for extract_postgres because AwsContext/AwsSettings
    # always pass an explicit region_name to boto3.Session() (default
    # "us-east-1", itself a separate documented gap -- see
    # docs/environment-inventory.md), so boto3 never needed to resolve
    # a region from the environment. watchtower's own internal
    # boto3.client("logs") construction (logging_config.py's
    # CloudWatch handler, run_output_shipper.py) has no such override
    # and failed with a real botocore.exceptions.NoRegionError the
    # first time either was actually exercised inside an Airflow
    # container -- confirmed live, not assumed, via a real
    # ship_databricks_run_logs task failure. Same value and reasoning
    # as bronze-consumer's own AWS_REGION/AWS_DEFAULT_REGION below in
    # this file.
    AWS_REGION: sa-east-1
    AWS_DEFAULT_REGION: sa-east-1

    # Personal terraform-admin key -- kept for now as a manual/ad-hoc
    # fallback, no longer read by any DAG task by default. dbt_run_gold/
    # dbt_test_gold moved onto mdp-dbt-gold-dev below (module.dbt_gold,
    # Terraform, already applied) -- see roadmap-next-steps.md for the
    # scope this dedicated identity covers (Athena mdp-athena-dbt-dev,
    # Glue read mdp_silver_dev / write mdp_gold_dev, S3 read silver/ +
    # read-write gold/).
    MDP_PERSONAL_ACCESS_KEY_ID: ${MDP_PERSONAL_ACCESS_KEY_ID}
    MDP_PERSONAL_SECRET_ACCESS_KEY: ${MDP_PERSONAL_SECRET_ACCESS_KEY}

    # mdp-dbt-gold-dev (Terraform module.dbt_gold, environments/dev/
    # security.tf) -- dedicated, least-privilege credential for
    # dbt_run_gold/dbt_test_gold (marketplace_batch_pipeline.py's
    # BashOperator env override), replacing MDP_PERSONAL_* above for
    # that specific use.
    MDP_DBT_GOLD_ACCESS_KEY_ID: ${MDP_DBT_GOLD_ACCESS_KEY_ID}
    MDP_DBT_GOLD_SECRET_ACCESS_KEY: ${MDP_DBT_GOLD_SECRET_ACCESS_KEY}

    # Dedicated Databricks PAT (comment "airflow-orchestration"), not
    # the personal OAuth session in ~/.databrickscfg -- read into the
    # databricks_default Connection's host/password.
    DATABRICKS_HOST: ${DATABRICKS_HOST}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}

    # Remote logging to the real CloudWatch log group Terraform
    # already provisions (module.cloudwatch_airflow, see
    # infrastructure/terraform/environments/dev/monitoring.tf) --
    # ships task logs there via aws_default (same credentials as
    # above) in parallel with the local files under
    # /opt/airflow/logs (AIRFLOW__LOGGING__DELETE_LOCAL_LOGS left at
    # its default False, so nothing local is deleted).
    AIRFLOW__LOGGING__REMOTE_LOGGING: 'True'
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: 'aws_default'
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: 'cloudwatch://${AIRFLOW_CLOUDWATCH_LOG_GROUP_ARN}'

    # Sprint 13 close-out: a second, separate CloudWatch destination
    # from the AIRFLOW__LOGGING__REMOTE_* block above -- that one is
    # Airflow's own task-log stream (raw stdout/stderr of the task,
    # via CloudwatchTaskHandler). This is this project's own
    # structlog JSON lines specifically (data_platform.observability.
    # logging_config.configure_logging(), called by
    # scripts/run_postgres_extraction_once.py,
    # scripts/run_silver_catalog_registration_once.py and
    # airflow/config/bootstrap.py -- the DAG task itself also calls
    # configure_logging(), so its structured events land in both
    # places: not a bug, different content/purpose per stream).
    # mdp-airflow-ingest-dev's own IAM (AWS_ACCESS_KEY_ID/SECRET
    # above) already covers logs:CreateLogGroup/CreateLogStream/
    # PutLogEvents/DescribeLogStreams/GetLogEvents on this exact log
    # group -- see infrastructure/terraform/environments/dev/security.tf.
    LOG_CLOUDWATCH_ENABLED: 'true'
    LOG_CLOUDWATCH_LOG_GROUP: ${PLATFORM_CLOUDWATCH_LOG_GROUP}

    # Sprint 13 close-out: read directly by
    # integrations/databricks/observability/run_output_shipper.py
    # (called from the ship_databricks_run_logs task,
    # marketplace_batch_pipeline.py) -- not part of the
    # configure_logging()/LOG_CLOUDWATCH_* pair above, a separate
    # log group with its own, more narrowly-scoped IAM grant (see
    # infrastructure/terraform/environments/dev/security.tf,
    # CloudWatchDatabricksLogs).
    DATABRICKS_CLOUDWATCH_LOG_GROUP: ${DATABRICKS_CLOUDWATCH_LOG_GROUP}

    # Native Airflow metrics (scheduler heartbeat, DAG/task duration,
    # pool slots, ...) -- emitted via StatsD, converted into labeled
    # Prometheus metrics by the statsd-exporter service (mapping
    # config: monitoring/statsd-exporter/mapping.yml) and scraped
    # from there by Prometheus. Requires the `statsd` pip package,
    # installed in airflow/Dockerfile.
    AIRFLOW__METRICS__STATSD_ON: 'True'
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: 8125
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # The following line can be used to set a custom config file, stored in the local config folder
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../airflow/plugins:/opt/airflow/plugins
    - ../../airflow/include:/opt/airflow/include
    - ../../airflow/config:/opt/airflow/config
    - ../../airflow/logs:/opt/airflow/logs
    - ../../src:/opt/mdp/src
    - ../../dbt:/opt/mdp/dbt
    - ./dbt/profiles.yml:/home/airflow/.dbt/profiles.yml

  user: "${AIRFLOW_UID:-1000}:0"
  
  networks:
    - mdp-network

  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres-airflow:
      condition: service_healthy

services:

  postgres-airflow:

    image: postgres:17

    container_name: mdp-postgres-airflow

    environment:

      POSTGRES_USER: airflow

      POSTGRES_PASSWORD: airflow

      POSTGRES_DB: airflow

    ports:

      - "5433:5432"

    volumes:

      - postgres_airflow_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD","pg_isready","-U","airflow"]

      interval: 10s

      retries: 5

      start_period: 5s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          # Etapa B (docs/architecture/roadmap-next-steps.md): first
          # container-level ceiling this service has ever had. ~2.5x
          # the ~204MB steady-state RSS observed live (two docker
          # stats readings, 3min apart, stable) -- generous because
          # this reading is Airflow mostly idle, not under a real DAG
          # run's connection/query load. Revisit if it OOMs.
          memory: 512M

    networks:

      - mdp-network

  postgres-marketplace:
    image: postgres:17

    container_name: mdp-postgres-marketplace

    restart: unless-stopped

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_marketplace_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/migrations:/migrations

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    deploy:
      resources:
        limits:
          # Etapa B: first ceiling this service has ever had. Steady-
          # state RSS observed live at only ~32MB (mostly idle) --
          # sized well above a pure multiplier of that (256M, not
          # ~64-128M) because this DB takes real query/write load
          # during actual pipeline runs (Spark batch writes, quality
          # checks) that this idle snapshot doesn't capture. Revisit
          # if it OOMs under real pipeline load.
          memory: 256M

    networks:
      - mdp-network

  postgres-metabase:
    image: postgres:17
    container_name: mdp-postgres-metabase
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase
    # No published port: this is Metabase's own internal application
    # state (dashboards/users/saved questions), not a datastore anyone
    # queries directly -- same reasoning as `redis` (Celery's broker)
    # staying internal-only, unlike postgres-marketplace/postgres-airflow
    # which are exposed for host-side psql access on purpose.
    volumes:
      - postgres_metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          # First ceiling this service has ever had -- no live reading
          # yet (new service). Sized like postgres-marketplace (256M):
          # same "small, mostly-idle Postgres" shape, light load
          # expected (Metabase's own app metadata, not pipeline data).
          # Revisit once real usage is observed.
          memory: 256M
    networks:
      - mdp-network

  metabase:
    image: metabase/metabase:v0.63.5
    container_name: mdp-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres-metabase
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      # BI Reader IAM User (Terraform: module.bi_reader, security.tf) --
      # dedicated, read-only, scoped to Gold/Athena/S3-gold. NOT the
      # same AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY already used by
      # Airflow above (those are terraform-admin's own key, copied into
      # this same .env file) -- deliberately distinct variable names in
      # .env so this service can't silently inherit the admin key by
      # both sides pointing at the same variable.
      AWS_ACCESS_KEY_ID: ${MDP_BI_READER_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MDP_BI_READER_SECRET_ACCESS_KEY}
      AWS_REGION: sa-east-1
      # Found live: default JVM heap sizing on a containerized JDK is
      # -XX:MaxRAMPercentage=25.0 -- 25% of the 1024M limit this
      # service originally had (~247.5MB) OOM'd during driver
      # registration, before boot even finished (RestartCount=1,
      # OOMKilled=false -- the JVM's own heap ceiling, not a cgroup
      # kill). JAVA_TOOL_OPTIONS is a standard JVM env var, honored by
      # any `java` invocation regardless of Metabase's own config
      # surface. Raised to 75% here, paired with the memory limit bump
      # below (1536M x 75% ~= 1.15GB heap, ~380M left for
      # metaspace/threads/direct buffers outside the heap).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    ports:
      # 3000 is Grafana's host port already -- Metabase's own default
      # (3000 inside the container) is remapped to 3001 on the host.
      - "3001:3000"
    depends_on:
      postgres-metabase:
        condition: service_healthy
    healthcheck:
      # Metabase's JVM boot is slow (typically 30-60s) -- start_period
      # set generously; revisit against a real observed boot time.
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # Raised from the original 1024M: at that limit, the JVM's
          # default -XX:MaxRAMPercentage=25.0 gave only ~247.5MB heap,
          # which OOM'd during boot (driver registration) -- see
          # JAVA_TOOL_OPTIONS above. 1536M x the new 75% ceiling
          # leaves ~380M outside the heap for metaspace/threads/direct
          # buffers. Revisit once real usage is observed.
          memory: 1536M
    networks:
      - mdp-network

  kafka:

    image: confluentinc/cp-kafka:7.8.0

    container_name: mdp-kafka

    restart: unless-stopped

    hostname: kafka

    ports:

      - "9092:29092"

    environment:

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      # Default (unset) resolves to -Xmx1G -Xms1G, confirmed via the
      # running process's actual java args. That, plus off-heap/page
      # cache, was the container's whole footprint with no memory
      # limit to contain it (~980MiB observed). This single-node dev
      # broker doesn't need 1G of heap; reduced to make room for the
      # container-level limit below without hitting GC pressure.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

    volumes:

      - kafka_data:/var/lib/kafka/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]

      interval: 15s

      timeout: 10s

      retries: 10

    deploy:
      resources:
        limits:
          # First container-level ceiling this service has ever had
          # (previously unbounded, competing for host RAM with no
          # predictability). 768M gives headroom over the 512M heap
          # for JVM overhead (metaspace, thread stacks, off-heap
          # buffers) and OS page cache for log segments -- not sized
          # from a formula, will be revisited if it OOMs under real
          # backlog load.
          memory: 768M

    networks:

      - mdp-network

  kafka-ui:

    image: provectuslabs/kafka-ui:latest

    container_name: mdp-kafka-ui

    restart: unless-stopped

    depends_on:

      kafka:

        condition: service_healthy

    ports:

      - "8085:8080"

    environment:

      KAFKA_CLUSTERS_0_NAME: Modern Data Platform

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    deploy:
      resources:
        limits:
          # Etapa B: first ceiling this service has ever had. ~1.8x
          # the ~283MB steady-state RSS observed live (two readings,
          # 3min apart, stable) -- a lighter multiplier than most
          # other Etapa B services since this is a UI-only proxy over
          # Kafka's REST/admin APIs, no heavy compute of its own.
          # Revisit if it OOMs.
          memory: 512M

    networks:

      - mdp-network

  debezium-connect:

    build:

      context: .

      dockerfile: debezium/Dockerfile

    container_name: mdp-debezium-connect

    restart: unless-stopped

    depends_on:

      postgres-marketplace:

        condition: service_healthy

      kafka:

        condition: service_healthy

    ports:

      - "8083:8083"

    environment:

      BOOTSTRAP_SERVERS: kafka:9092

      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs

      OFFSET_STORAGE_TOPIC: connect_offsets

      STATUS_STORAGE_TOPIC: connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 1

      OFFSET_STORAGE_REPLICATION_FACTOR: 1

      STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"

      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"

      CONNECT_PLUGIN_PATH: /kafka/connect,/kafka/connect/debezium-plugins

      # Default (unset) resolves to -Xms256M -Xmx2G, confirmed via the
      # running process's actual java args -- way oversized for a
      # single connector against one small Postgres DB (actual RSS
      # observed at 691MiB, well under that 2G ceiling). 768M chosen
      # over the plan's original 512M example: real RSS was already
      # ~691MiB under the old 2G heap, and most of that isn't live
      # heap (JVM/connector overhead) -- 512m risked just moving the
      # OOM here instead of fixing it. Ms kept at 256m (unchanged).
      #
      # NOTE the var name: this image's docker-entrypoint.sh only
      # reads plain HEAP_OPTS for the JVM flags (translating it to
      # KAFKA_HEAP_OPTS internally before launching connect-distributed.sh)
      # -- CONNECT_HEAP_OPTS was tried first by analogy with the other
      # CONNECT_* vars below, but those all map to connect.properties
      # keys (CONNECT_KEY_CONVERTER -> key.converter etc.), a
      # different mechanism; it was silently ignored (heap unchanged
      # at 2G). Confirmed by exec'ing into the container and checking
      # the running java process's actual -Xmx/-Xms args.
      HEAP_OPTS: "-Xms256m -Xmx768m"

    healthcheck:

      test:

        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8083/connectors"
        ]

      interval: 20s

      timeout: 10s

      retries: 10

    volumes:

      - ./debezium/connectors:/connectors:ro

    deploy:
      resources:
        limits:
          # First container-level ceiling this service has ever had.
          # 1024M gives headroom over the 768M heap for JVM overhead
          # and connector-side buffers -- revisit if it OOMs under
          # real CDC load.
          memory: 1024M

    networks:

      - mdp-network

  platform-init:

    build:
      context: .
      dockerfile: debezium/bootstrap/Dockerfile

    container_name: mdp-platform-init

    restart: "no"

    depends_on:
      debezium-connect:
        condition: service_healthy

    volumes:
      - ./debezium/connectors:/connectors:ro

    networks:
      - mdp-network

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    container_name: mdp-redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          # Etapa B: first ceiling this service has ever had. ~8.5x
          # the ~15MB steady-state RSS observed live -- a floor-based
          # number rather than a pure multiplier (128M matches the
          # 64M floor already used for pushgateway/statsd-exporter,
          # doubled since Redis backs Airflow's Celery broker and
          # could hold more in-flight task messages under real DAG
          # concurrency than this idle snapshot shows). Revisit if it
          # OOMs.
          memory: 128M
    networks:
     - mdp-network

  airflow-apiserver:
    <<: *airflow-common
    container_name: mdp-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Etapa B: first ceiling this service has ever had. ~2.3x
          # the ~1311MB steady-state RSS observed live (two readings,
          # 3min apart, stable) -- the biggest of the 5 Airflow
          # components already at idle, so the largest margin of the
          # group for request-burst headroom. This reading is Airflow
          # mostly idle, not under real concurrent API load. Revisit
          # if it OOMs.
          memory: 3072M

  airflow-scheduler:
    <<: *airflow-common
    container_name: mdp-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Etapa B: first ceiling this service has ever had. ~2.2x
          # the ~355MB steady-state RSS observed live (two readings,
          # 3min apart, stable). Revisit if it OOMs.
          memory: 768M

  airflow-dag-processor:
    <<: *airflow-common
    container_name: mdp-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Etapa B: first ceiling this service has ever had. Two live
          # readings 3min apart ranged 260-392MB (this component
          # re-parses DAG files periodically, more variable than the
          # other Airflow components) -- 1024M gives margin over the
          # higher reading for future DAG-count growth. Revisit if it
          # OOMs.
          memory: 1024M

  airflow-worker:
    <<: *airflow-common
    container_name: mdp-airflow-worker
    command: celery worker
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Etapa B: first ceiling this service has ever had. ~2.6x
          # the ~990MB steady-state RSS observed live (two readings,
          # 3min apart, stable) -- the most generous multiplier of
          # the group: this component executes actual DAG task code,
          # and neither reading was taken during a real heavy task
          # run, so its true peak-under-load is unconfirmed. Revisit
          # if it OOMs.
          memory: 2560M

  airflow-triggerer:
    <<: *airflow-common
    container_name: mdp-airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Etapa B: first ceiling this service has ever had. The
          # ~262MB pre-restart baseline undershot what this service
          # actually settles at post-restart with its own limit
          # applied -- 512M (originally chosen as ~2x that baseline)
          # was observed live at 367.8MB/512M (71.83%), stable across
          # two readings 90s apart (not still climbing, but tighter
          # margin than intended). Raised to 768M (~2x the actually-
          # observed 367.8MB) instead of leaving this at a tight
          # margin marked "revisit if it OOMs". Revisit again if it
          # OOMs even at this level.
          memory: 768M

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo       
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    container_name: mdp-airflow-cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  airflow-bootstrap:
    <<: *airflow-common

    container_name: mdp-airflow-bootstrap

    restart: "no"

    command:
      - bash
      - -c
      - |
        echo "Running Airflow bootstrap..."
        python /opt/airflow/config/bootstrap.py
        echo "Bootstrap completed."

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    networks:
      - mdp-network

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  flower:
    <<: *airflow-common
    container_name: mdp-airflow-flower
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-bootstrap:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # Observability stack (Sprint 13, Decision 4): Prometheus scrapes 3
  # sources -- statsd-exporter (native Airflow metrics), pushgateway
  # (short-lived processing-framework runs, via PrometheusHook) and
  # bronze-consumer (scraped directly, long-running) -- Grafana reads
  # from Prometheus. See monitoring/prometheus/prometheus.yml.
  #
  # Resource limits on all 5 services below are deliberately
  # conservative: this is the same host whose RAM shortage paused
  # this sprint before .wslconfig was fixed (memory=8GB, swap=4GB) --
  # see docs/environment-inventory.md. Sized from each tool's own
  # idle/small-workload footprint, not a fraction of total host RAM:
  # pushgateway/statsd-exporter (64M) are stateless converters/
  # in-memory stores holding a handful of metrics; prometheus/grafana
  # (256M) have a real but small baseline (TSDB + UI process,
  # 3 scrape targets, no dashboards yet); bronze-consumer (512M) is
  # the outlier because pyarrow/deltalake/confluent-kafka's own
  # baseline RSS is non-trivial even before any buffered records.
  # Total ceiling ~1.1GiB, against ~2.2GiB available at the time this
  # was sized (free -h, all pre-existing services already running).
  # ------------------------------------------------------------------

  pushgateway:
    image: prom/pushgateway:v1.11.3
    container_name: mdp-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks:
      - mdp-network

  statsd-exporter:
    image: prom/statsd-exporter:v0.29.0
    container_name: mdp-statsd-exporter
    restart: unless-stopped
    command:
      - "--statsd.mapping-config=/etc/statsd-exporter/mapping.yml"
      # statsd_exporter's own default is :9125, not the classic statsd
      # port -- overridden to 8125 to match
      # AIRFLOW__METRICS__STATSD_PORT (x-airflow-common-env) and
      # Airflow's own default statsd_port, instead of the other way
      # around. Found live: 0 packets/lines received at the exporter
      # despite Airflow sending them (confirmed with a manual UDP
      # send from mdp-airflow-scheduler) -- silently dropped, nothing
      # was listening on 8125.
      - "--statsd.listen-udp=:8125"
    volumes:
      - ./monitoring/statsd-exporter/mapping.yml:/etc/statsd-exporter/mapping.yml:ro
    ports:
      - "9102:9102"
      - "8125:8125/udp"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9102/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks:
      - mdp-network

  bronze-consumer:
    build:
      context: ../..
      dockerfile: infrastructure/docker/streaming/Dockerfile
    container_name: mdp-bronze-consumer
    restart: unless-stopped
    # Docker's own --init equivalent: without it, PID 1 inside the
    # container is the Python process itself, not a real init (tini,
    # which this flag wires in automatically) -- so it never reaps
    # zombie child processes, and a signal PID 1 doesn't handle itself
    # has nothing forwarding it. Found live, 2026-08-10: `docker
    # restart mdp-bronze-consumer` failed outright with "container ...
    # PID ... is zombie and can not be killed. Use the --init option
    # ..." -- Docker eventually force-killed the container after its
    # own internal retry/timeout, but it then sat stopped rather than
    # recovering on its own (`restart: unless-stopped` doesn't cover
    # this path -- the container wasn't "stopped" through that
    # policy's own mechanism). See docs/architecture/
    # roadmap-next-steps.md, "`docker restart mdp-bronze-consumer`
    # failed outright: container process was a zombie". Low-risk,
    # additive (a real init process, no behavior change to the app
    # itself) -- included here rather than as a separate change.
    init: true
    environment:
      PLATFORM_MESSAGING_PROVIDER: kafka
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      # resolve_bronze_schema() (data_platform.compute.bronze_schema)
      # queries information_schema.columns for every entity at
      # startup, before consuming a single Kafka message -- same
      # Postgres PostgresSettings() defaults to "localhost", which
      # doesn't resolve inside this container.
      POSTGRES_HOST: postgres-marketplace
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # mdp-bronze-consumer-dev (Terraform: module.bronze_consumer,
      # environments/dev/security.tf) -- dedicated, least-privilege:
      # bronze/ S3 read-write only, no DeleteObject (append-only
      # writer, never vacuums/compacts its own table -- see that
      # module's own policy-document comment). Replaces the personal
      # terraform-admin key (MDP_PERSONAL_ACCESS_KEY_ID/SECRET) this
      # container used to share with dbt_run_gold/dbt_test_gold --
      # see roadmap-next-steps.md's "Airflow's AWS credentials"
      # remaining-work entry, and its own "Bronze Consumer's own AWS
      # credential -- dedicated IAM" entry for this specific swap.
      # NOT AWS_ACCESS_KEY_ID/SECRET either (those hold
      # mdp-airflow-ingest-dev, scoped to raw/ only -- a different
      # prefix, unrelated identity).
      AWS_ACCESS_KEY_ID: ${MDP_BRONZE_CONSUMER_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MDP_BRONZE_CONSUMER_SECRET_ACCESS_KEY}
      # write_deltalake() (the pure-Rust `deltalake` S3 client -- the
      # only place in this project that talks to S3 without boto3,
      # see bronze_consumer.py's module docstring) doesn't follow a
      # cross-region redirect the way boto3 does: with no region
      # configured, every write failed with "Received redirect
      # without LOCATION" against the real bucket (mdp-datalake-dev,
      # sa-east-1, not the SDK's us-east-1 default) -- found during
      # this sprint's live validation, no image rebuild needed since
      # it's config-only. Value from airflow/config/terraform_outputs.json
      # (aws_region), same source docs/architecture/roadmap-next-steps.md
      # already names for AIRFLOW_CLOUDWATCH_LOG_GROUP_ARN.
      AWS_REGION: sa-east-1
      AWS_DEFAULT_REGION: sa-east-1
      # Sprint 13 close-out: ships the same structlog JSON lines the
      # console already prints to the platform CloudWatch log group
      # (module.cloudwatch_platform, monitoring.tf), additive to
      # console output, not a replacement -- see
      # data_platform/observability/logging_config.py and
      # roadmap-next-steps.md. mdp-bronze-consumer-dev's own IAM
      # (MDP_BRONZE_CONSUMER_ACCESS_KEY_ID/SECRET above) already
      # covers logs:CreateLogGroup/CreateLogStream/PutLogEvents/
      # DescribeLogStreams/GetLogEvents on this exact log group.
      LOG_CLOUDWATCH_ENABLED: "true"
      LOG_CLOUDWATCH_LOG_GROUP: ${PLATFORM_CLOUDWATCH_LOG_GROUP}
    ports:
      - "9200:9200"
    depends_on:
      kafka:
        condition: service_healthy
      postgres-marketplace:
        condition: service_healthy
      platform-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD"
        - "/app/.venv/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:9200/metrics', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # Raised from the originally planned 512M after a real
          # kernel cgroup OOM kill (confirmed via dmesg: "Memory
          # cgroup out of memory ... anon-rss:511428kB", right at the
          # 512M ceiling) during live validation. Root cause:
          # data_platform.bootstrap() eagerly registers every
          # provider (AWS, Databricks, Airflow, Kafka) regardless of
          # which one a caller actually needs -- run_bronze_consumer.py
          # only uses Kafka, but still loads boto3, databricks-sdk
          # and the rest of that graph. Not something to fix here
          # (pre-existing, shared by every entry point) -- 1024M
          # gave real headroom over the ~512MB+ observed peak instead
          # of a number picked from idle-footprint guesses.
          #
          # Raised again to 1536M: with _MAX_POLL_BATCH_SIZE=25
          # (consume_batch() polling up to 25 messages per topic per
          # iteration instead of 1), RSS was observed at ~984MiB/1024M
          # (96%) under backlog catch-up, plus 19 process restarts
          # during that window consistent with silent OOM kills.
          # Applied together with giving Kafka/Debezium their own
          # container limits (previously unbounded, competing for the
          # same host RAM) -- see roadmap-next-steps.md.
          memory: 1536M
    networks:
      - mdp-network

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: mdp-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Local dev only -- keeps disk bounded, no need for long-term
      # retention on a stack that gets torn down/rebuilt often.
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - statsd-exporter
      - pushgateway
      - bronze-consumer
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - mdp-network

  grafana:
    image: grafana/grafana:13.1.2
    container_name: mdp-grafana
    restart: unless-stopped
    # Same zombie-PID-1 issue already documented and fixed for
    # bronze-consumer (docs/architecture/roadmap-next-steps.md) hit
    # live here too, first time this container ever needed a real
    # restart in this session: `docker compose restart grafana` failed
    # outright with "container ... is zombie and can not be killed".
    # Same fix, same reasoning -- a real init process (tini), low-risk
    # and additive, no behavior change to Grafana itself.
    init: true
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Real Telegram contact point (provisioning/alerting/contactpoints.yml)
      # -- these two are plain container env vars, not GF_*-prefixed,
      # read via Grafana provisioning's own ${TELEGRAM_BOT_TOKEN} /
      # ${TELEGRAM_CHAT_ID} expansion so the real token/chat id never
      # sits in a tracked YAML file. Bot: @AlertasMDP_bot.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - mdp-network

volumes:

  postgres_airflow_data:

  postgres_marketplace_data:

  postgres_metabase_data:

  kafka_data:

  redis_data:

  airflow_logs:

  airflow_config:

  airflow_plugins:

  prometheus_data:

  grafana_data:

networks:

  mdp-network:

    driver: bridge