resources:
  jobs:
    full_pipeline:
      name: Full Pipeline

      parameters:
        - name: entities
          default: customers

      tasks:
        - task_key: bronze

          run_job_task:
            job_id: ${resources.jobs.bronze.id}
            job_parameters:
              entities: "{{job.parameters.entities}}"

        - task_key: bronze_validate

          depends_on:
            - task_key: bronze

          run_job_task:
            job_id: ${resources.jobs.bronze_validate.id}
            job_parameters:
              entities: "{{job.parameters.entities}}"

        - task_key: bronze_optimize

          depends_on:
            - task_key: bronze_validate

          run_job_task:
            job_id: ${resources.jobs.bronze_optimize.id}
            job_parameters:
              entities: "{{job.parameters.entities}}"

        - task_key: silver

          depends_on:
            - task_key: bronze_optimize

          run_job_task:
            job_id: ${resources.jobs.silver.id}
            job_parameters:
              entities: "{{job.parameters.entities}}"
