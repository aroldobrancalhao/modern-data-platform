name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Keep in sync with pyproject.toml's requires-python (">=3.12,<3.13").
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # `streaming` extra is required for tests/unit's confluent-kafka
        # imports; `orchestration`/`warehouse` are not exercised by
        # tests/unit and are skipped to keep CI installs lean.
        run: uv sync --frozen --extra streaming

      - name: Run unit tests
        # tests/integration/ needs live infra (Postgres/Kafka/Airflow) and
        # is intentionally excluded -- see
        # tests/integration/processing/test_workflow_context_writer_real_airflow.py
        # for an example with no skip-if-unreachable guard.
        run: uv run pytest tests/unit
