version: 2

models:
  - name: int_order_items_enriched
    description: >
      order_items enriched with order, product, seller and category
      context. Grain: one row per order_item (same as
      stg_order_items) -- a clean join, no aggregation, no business
      rules yet (that's dim_/fact_).
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

      - name: category_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_categories')
                field: category_id
