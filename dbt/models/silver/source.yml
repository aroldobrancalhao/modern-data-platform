version: 2

sources:
  - name: silver
    description: >
      Silver layer, registered in Glue by SilverCatalogRegistrationStage
      (see ADR-011). Standardized output of transform_silver.ipynb --
      no business modeling here, only column hygiene/dedup.
    database: awsdatacatalog
    schema: mdp_silver_dev

    tables:
      - name: customers
        description: >
          Marketplace customers, standardized (see
          apply_standard_transformations). Registered in Glue via
          scripts/run_silver_catalog_registration_once.py.

      - name: orders
        description: Marketplace orders, standardized.

      - name: order_items
        description: Line items belonging to an order, standardized.

      - name: products
        description: Seller catalog products, standardized.

      - name: payments
        description: Payments made against an order, standardized.

      - name: sellers
        description: Marketplace sellers, standardized.

      - name: categories
        description: Product categories, standardized.

      - name: order_status_history
        description: Order status change history, standardized.
