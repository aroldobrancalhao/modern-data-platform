[project]
name = "modern-data-platform"
version = "0.1.0"
description = "Cloud-agnostic modern data platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [
    { name = "Aroldo Brancalhao Junior" }
]

dependencies = [
    "alembic>=1.18.5",
    "apache-airflow==3.0.4",
    "apache-airflow-providers-standard>=1.16.0",
    "boto3>=1.43.52",
    "confluent-kafka>=2.15.0",
    "databricks-sdk>=0.122.0",
    "dbt-athena>=1.11.0",
    "dbt-core>=1.12.0",
    "faker>=40.28.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "pyspark>=4.1.0",
    "mypy>=2.3.0",
    "boto3-stubs>=1.43.53",
    "mypy-boto3-s3>=1.43.50",
    "nbqa>=1.9.1",
    "types-pyyaml>=6.0.12.20260724",
    "pytest-cov>=7.1.0",
    "delta-spark>=4.3.1",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
markers = [
    "real_aws: requires valid AWS credentials and network access",
    "real_databricks: requires valid Databricks credentials and network access",
    "real_kafka: requires a reachable local Kafka broker (docker compose)",
    "spark_local: boots a real local SparkSession (~20-30s) -- no external infra required, excluded from the default suite for speed only",
]
addopts = '-m "not real_aws and not real_databricks and not real_kafka and not spark_local"'

[tool.ruff]
src = ["src"]

exclude = [
    ".venv",
    "build",
    "dist",
    "notebooks",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "boto3",
    "botocore",
    "botocore.*",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true
